# LiteLLM Configuration
# This file configures available models for the LiteLLM proxy

model_list:
  # OpenAI models (requires OPENAI_API_KEY environment variable)
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: env::OPENAI_API_KEY
  
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: env::OPENAI_API_KEY
  
  - model_name: gpt-3.5-turbo
    litellm_params:
      model: openai/gpt-3.5-turbo
      api_key: env::OPENAI_API_KEY

  # Anthropic models (requires ANTHROPIC_API_KEY environment variable)
  - model_name: claude-3-5-sonnet
    litellm_params:
      model: anthropic/claude-3-5-sonnet-20241022
      api_key: env::ANTHROPIC_API_KEY

  # Local/Open Source models (no API key required)
  # Uncomment if you have Ollama running locally
  # - model_name: llama2
  #   litellm_params:
  #     model: ollama/llama2
  #     api_base: http://localhost:11434

# General settings
general_settings:
  master_key: sk-1234  # Optional master key for proxy access
  
# Logging
litellm_settings:
  success_callback: ["langfuse"]  # Optional: add logging providers
  failure_callback: ["langfuse"]