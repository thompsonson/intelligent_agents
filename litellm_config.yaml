# LiteLLM Configuration
# This file configures available models for the LiteLLM proxy

model_list:
  # OpenAI models (requires OPENAI_API_KEY environment variable)
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY
  
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  # Anthropic models (requires ANTHROPIC_API_KEY environment variable)
  - model_name: claude-3-5-sonnet
    litellm_params:
      model: anthropic/claude-3-5-sonnet-20241022
      api_key: os.environ/ANTHROPIC_API_KEY
  
  - model_name: claude-3-haiku
    litellm_params:
      model: anthropic/claude-3-haiku-20240307
      api_key: os.environ/ANTHROPIC_API_KEY
  
  # Ollama models (no API key required)
  # Remote Ollama instance at http://100.93.83.103:11434
  - model_name: codegeex4
    litellm_params:
      model: ollama/codegeex4:latest
      api_base: http://100.93.83.103:11434
  
  - model_name: gemma2-2b
    litellm_params:
      model: ollama/gemma2:2b
      api_base: http://100.93.83.103:11434
  
  - model_name: gemma-2b
    litellm_params:
      model: ollama/gemma:2b
      api_base: http://100.93.83.103:11434
  
  - model_name: gemma
    litellm_params:
      model: ollama/gemma:latest
      api_base: http://100.93.83.103:11434
  
  - model_name: mistral-7b
    litellm_params:
      model: ollama/mistral:7b
      api_base: http://100.93.83.103:11434
  
  - model_name: phi4
    litellm_params:
      model: ollama/phi4:latest
      api_base: http://100.93.83.103:11434
  
  # Mathematical reasoning specialized models
  - model_name: qwen2-math-7b
    litellm_params:
      model: ollama/qwen2-math:7b-instruct
      api_base: http://100.93.83.103:11434
  
  - model_name: deepseek-math-7b
    litellm_params:
      model: ollama/t1c/deepseek-math-7b-rl
      api_base: http://100.93.83.103:11434

# General settings
general_settings:
  master_key: sk-1234  # Optional master key for proxy access
  
# Logging - explicitly disable all database-dependent features
litellm_settings:
  success_callback: []  # No logging callbacks
  failure_callback: []  # No logging callbacks